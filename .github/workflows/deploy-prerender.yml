# Full-site prerender + deploy to Vercel.
#
# Why this exists: prerendering all ~949 routes through headless Chromium does
# not fit inside Vercel's 45-minute build limit. GitHub Actions has no such
# limit, so we build + prerender EVERY route here (PRERENDER_MAX_ROUTES=0), then
# hand the finished `dist/` to Vercel as a prebuilt deployment. Vercel does not
# rebuild — it just serves the artifact — so the 45-minute limit never applies.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       Personal token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      From `.vercel/project.json` or the Vercel project settings
#   VERCEL_PROJECT_ID  From `.vercel/project.json` or the Vercel project settings
#
# NOTE: While this workflow is active it becomes the source of production
# deploys. Turn OFF Vercel's own Git auto-deploy for the production branch
# (Vercel project -> Settings -> Git) so the two don't race; the capped
# in-build prerender stays as a safety net for Vercel preview deploys on PRs.

name: Deploy (full prerender)

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: deploy-prerender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Prerender the whole site: 0 = no cap.
      PRERENDER_MAX_ROUTES: '0'
      # On the GitHub Actions runner we use the full `puppeteer` Chromium (its
      # system libraries are installed below), NOT the serverless path — so leave
      # PRERENDER_SERVERLESS unset. Runners have more cores than Vercel's box.
      PRERENDER_CONCURRENCY: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Puppeteer's bundled Chromium needs these shared libraries on Ubuntu.
      - name: Install Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            libatspi2.0-0 libgtk-3-0 || \
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 \
            libatspi2.0-0 libgtk-3-0

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Link the project deterministically by writing .vercel/project.json from
      # the secrets, instead of `vercel pull` (which can fail with "Could not
      # retrieve Project Settings" when it tries to resolve the project itself).
      # This way only VERCEL_TOKEN must be valid; the org/project ids come
      # straight from the secrets.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          { "orgId": "${{ secrets.VERCEL_ORG_ID }}", "projectId": "${{ secrets.VERCEL_PROJECT_ID }}" }
          JSON
          vercel pull --yes --environment=production --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `vercel build` runs the project's own build (prebuild sitemap -> vite
      # build -> postbuild prerender) and emits the Build Output API artifact in
      # `.vercel/output`. The env vars above apply to that build, so the
      # prerender covers EVERY route (no cap) using the serverless Chromium.
      # There is no 45-minute limit on GitHub Actions.
      - name: Build and prerender all routes
        run: vercel build --prod --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifact to Vercel (production)
        run: |
          vercel deploy --prebuilt --prod --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" > deploy-url.txt
          echo "Deployed: $(cat deploy-url.txt)"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
